<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cari Layout Villa</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mut:#667085;--pri:#1f3864;--acc:#c2410c;--line:#d9dee8;--on:#fff;--soft:#e8eefb;--ok:#15803d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2233;--tx:#eef2fb;--mut:#9aa6bd;--pri:#7aa2f7;--acc:#fb923c;--line:#2c3650;--on:#0f1420;--soft:#26324d;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2233;--tx:#eef2fb;--mut:#9aa6bd;--pri:#7aa2f7;--acc:#fb923c;--line:#2c3650;--on:#0f1420;--soft:#26324d;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:10}
header{background:var(--pri);color:var(--on);padding:14px 16px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{margin:0;font-size:18px}
header small{opacity:.85}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:rgba(255,255,255,.18);color:var(--on);font-weight:700;font-size:15px}
.tabs button.on{background:var(--card);color:var(--pri)}
main{max-width:560px;margin:0 auto;padding:14px 14px 90px}
h2{font-size:14px;color:var(--mut);margin:14px 2px 8px;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid.t{grid-template-columns:repeat(3,1fr)}
.chip{padding:14px 4px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;font-size:17px;font-weight:700;text-align:center}
.chip small{display:block;font-size:11px;font-weight:500;color:var(--mut)}
.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.chip.on small{color:var(--on);opacity:.85}
.chip.empty{border-style:dashed;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.big{font-size:56px;font-weight:800;color:var(--acc);line-height:1}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row span:first-child{color:var(--mut)}
.row span:last-child{text-align:right;font-weight:600;overflow-wrap:anywhere}
.item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--card);width:100%;color:var(--tx);text-align:left;font-size:16px}
.item b{font-size:20px;min-width:48px}
.item i{color:var(--mut);font-style:normal;font-size:14px}
.btn{padding:12px 16px;border:0;border-radius:12px;background:var(--pri);color:var(--on);font-weight:700;font-size:15px}
.btn.g{background:var(--soft);color:var(--pri)}
.muted{color:var(--mut);font-size:14px}
.warn{color:var(--acc);font-weight:600}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mut);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>🏠 Layout Villa S1–S14</h1>
  <small>Cari tipe layout (U1–U6) tanpa buka shopdrawing</small>
  <div class="tabs"><button id="tV" class="on">Per Villa</button><button id="tT">Per Tipe</button></div>
</header>
<main id="app"></main>

<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<script type="application/json" id="data">{"S1":{"t":"","l":"","c":""},"S2":{"t":"","l":"","c":""},"S3":{"t":"","l":"","c":""},"S4":{"t":"","l":"","c":""},"S5":{"t":"","l":"","c":""},"S6":{"t":"","l":"","c":""},"S7":{"t":"","l":"","c":""},"S8":{"t":"","l":"","c":""},"S9":{"t":"","l":"","c":""},"S10":{"t":"","l":"","c":""},"S11":{"t":"","l":"","c":""},"S12":{"t":"","l":"","c":""},"S13":{"t":"","l":"","c":""},"S14":{"t":"","l":"","c":""}}</script>
<script>
const $=s=>document.querySelector(s);
const VILLAS=Array.from({length:14},(_,i)=>'S'+(i+1)), TIPE=['U1','U2','U3','U4','U5','U6'];
let D=JSON.parse($('#data').textContent), tab='V', selV='S1', selT='U1', art=null, edit=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const filled=()=>VILLAS.filter(v=>D[v].t).length;

function render(){
  $('#tV').classList.toggle('on',tab==='V'); $('#tT').classList.toggle('on',tab==='T');
  let h='';
  if(tab==='V'){
    h+='<h2>Pilih villa</h2><div class="grid">'+VILLAS.map(v=>`<button class="chip ${v===selV?'on':''} ${D[v].t?'':'empty'}" data-v="${v}">${v}<small>${esc(D[v].t||'—')}</small></button>`).join('')+'</div>';
    const d=D[selV];
    h+=`<div class="card"><div class="muted">Villa ${selV} memakai layout</div>`+
      (d.t?`<div class="big">${esc(d.t)}</div>`:'<div class="big" style="font-size:28px">Belum diisi</div>')+
      `<div style="margin-top:12px"><div class="row"><span>Lembar shopdrawing</span><span>${esc(d.l||'-')}</span></div><div class="row"><span>Catatan</span><span>${esc(d.c||'-')}</span></div></div>`+
      (d.t?`<div class="row"><span>Villa lain tipe sama</span><span>${esc(VILLAS.filter(v=>v!==selV&&D[v].t===d.t).join(', ')||'-')}</span></div>`:'')+
      (edit?`<button class="btn" style="margin-top:12px;width:100%" id="eV">✏️ Ubah data ${selV}</button>`:'')+'</div>';
  }else{
    h+='<h2>Pilih tipe layout</h2><div class="grid t">'+TIPE.map(t=>{const n=VILLAS.filter(v=>D[v].t===t).length;return `<button class="chip ${t===selT?'on':''}" data-t="${t}">${t}<small>${n} villa</small></button>`}).join('')+'</div>';
    const list=VILLAS.filter(v=>D[v].t===selT);
    h+=`<h2>Villa dengan layout ${selT} (${list.length})</h2>`+(list.length?list.map(v=>`<button class="item" data-go="${v}"><b>${v}</b><i>Lembar: ${esc(D[v].l||'-')}${D[v].c?' · '+esc(D[v].c):''}</i></button>`).join(''):'<p class="muted">Belum ada villa untuk tipe ini.</p>');
  }
  if(filled()<14) h+=`<p class="muted" style="margin-top:18px">Data terisi ${filled()} dari 14 villa.</p>`;
  if(edit) h+='<div style="margin-top:18px;display:flex;gap:8px"><button class="btn g" id="imp" style="flex:1">📋 Impor tempel data</button></div>';
  if(art&&!edit) h+='<p style="text-align:center;margin-top:24px"><button class="btn g" id="eOn">🔒 Mode edit (pemilik)</button></p>';
  if(edit) h+='<p style="text-align:center"><button class="btn g" id="eOff">Selesai edit</button></p>';
  $('#app').innerHTML=h;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='tV'){tab='V';render()} else if(b.id==='tT'){tab='T';render()}
  else if(b.dataset.v){selV=b.dataset.v;render()} else if(b.dataset.t){selT=b.dataset.t;render()}
  else if(b.dataset.go){selV=b.dataset.go;tab='V';render();scrollTo(0,0)}
  else if(b.id==='eOn'){edit=true;render()} else if(b.id==='eOff'){edit=false;render()}
  else if(b.id==='eV') openEdit(); else if(b.id==='imp') openImport();
  else if(b.id==='cancel') closeSheet();
});
function openSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').classList.add('show')}
function closeSheet(){$('#sheet').classList.remove('show')}
function openEdit(){
  const d=D[selV];
  openSheet(`<h3 style="margin-top:0">Ubah ${selV}</h3><label>Tipe layout</label><select id="fT"><option value="">(belum diisi)</option>${TIPE.map(t=>`<option ${d.t===t?'selected':''}>${t}</option>`).join('')}</select>
  <label>No. lembar shopdrawing</label><input id="fL" value="${esc(d.l)}" placeholder="contoh: A-12"><label>Catatan</label><input id="fC" value="${esc(d.c)}" placeholder="contoh: kamar mandi dibalik">
  <div style="display:flex;gap:8px"><button class="btn g" id="cancel" style="flex:1">Batal</button><button class="btn" id="save" style="flex:2">Simpan</button></div>`);
  $('#save').onclick=()=>{D[selV]={t:$('#fT').value,l:$('#fL').value.trim(),c:$('#fC').value.trim()};closeSheet();persist()};
}
function openImport(){
  openSheet(`<h3 style="margin-top:0">Impor tempel data</h3><p class="muted">Satu villa per baris, dipisah koma atau tab:<br><b>S1, U3, A-12, catatan (opsional)</b><br>Bisa langsung copy dari Google Sheets.</p>
  <textarea id="fP" rows="8" placeholder="S1, U3, A-12&#10;S2, U1, A-10"></textarea>
  <div style="display:flex;gap:8px"><button class="btn g" id="cancel" style="flex:1">Batal</button><button class="btn" id="doImp" style="flex:2">Impor</button></div>`);
  $('#doImp').onclick=()=>{let n=0;$('#fP').value.split('\n').forEach(r=>{const p=r.split(/\t|,|;/).map(x=>x.trim());const v=p[0].toUpperCase(),t=(p[1]||'').toUpperCase();if(D[v]&&(TIPE.includes(t)||t==='')){D[v]={t,l:p[2]||'',c:p.slice(3).join(', ')};n++}});closeSheet();if(n)persist();else alert('Tidak ada baris yang cocok.')};
}
async function persist(){
  render();
  if(!art) return;
  try{
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#app').innerHTML='';c.querySelector('#sheetBody').innerHTML='';c.querySelector('#sheet').className='sheet';
    c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
    c.querySelector('#tV').className='on';c.querySelector('#tT').className='';
    await art.publish('<!DOCTYPE html>\n'+c.outerHTML);
  }catch(e){ if(e&&e.code!=='conflict') alert('Gagal menyimpan: '+(e.message||e.code)); }
}
render();
(async()=>{try{art=await claude.use('artifact');if(art)render()}catch(e){}})();
</script>
</body>
</html>
